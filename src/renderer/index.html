<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <title>DeepSeek Harness</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, "PingFang SC", "Segoe UI", sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .spin {
      width: 28px; height: 28px; margin-bottom: 16px;
      border: 3px solid #333; border-top-color: #4fc3f7;
      border-radius: 50%; animation: rot 0.9s linear infinite;
    }
    @keyframes rot { to { transform: rotate(360deg); } }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { font-size: 13px; color: #8a8aa0; margin: 0 0 24px; text-align: center; }
    .bar {
      width: 260px; height: 6px; border-radius: 3px;
      background: #333; overflow: hidden;
    }
    .bar-fill {
      height: 100%; width: 0%;
      background: #4fc3f7; border-radius: 3px;
      transition: width 0.2s ease;
    }
    .percent { margin-top: 10px; font-size: 12px; color: #8a8aa0; }
    .error { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="spin" id="spinner"></div>
  <h1 id="title">正在启动 DeepSeek Harness…</h1>
  <p id="message">正在准备运行环境，请稍候</p>
  <div class="bar" id="bar"><div class="bar-fill" id="fill"></div></div>
  <div class="percent" id="percent"></div>

  <script>
    const titleEl = document.getElementById('title');
    const msgEl = document.getElementById('message');
    const fillEl = document.getElementById('fill');
    const pctEl = document.getElementById('percent');

    window.dshDesktop.onSetupProgress(({ stage, message, percent }) => {
      console.log('[setup] progress:', stage, message, percent);
      msgEl.textContent = message || '正在准备运行环境，请稍候';
      if (typeof percent === 'number' && percent > 0) {
        fillEl.style.width = percent + '%';
        pctEl.textContent = percent + '%';
      }
    });
    window.dshDesktop.onError((message) => {
      titleEl.textContent = '启动失败';
      titleEl.classList.add('error');
      msgEl.textContent = message || '初始化失败，请查看日志';
    });
  </script>
</body>
</html>
