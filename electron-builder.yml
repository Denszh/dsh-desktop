appId: app.dsh.desktop
productName: DshDesktop
publish:
  provider: github
  owner: Denszh
  repo: dsh-desktop
directories:
  output: release
  buildResources: resources

# 壳最小化：不打包 node_modules（dsh 运行时由 app 首次启动时从 Releases 下载）。
# dependencies 里的 @deepseek-ai/dsh 仅 dev 打包 dsh-runtime zip 用，不打进安装包。
files:
  - src/**/*
  - package.json
  - '!node_modules/**'

extraResources:
  - from: resources/app-icon.png
    to: dsh-desktop-resources/app-icon.png
  - from: resources/tray-icon.png
    to: dsh-desktop-resources/tray-icon.png
  - from: resources/tray-icon@2x.png
    to: dsh-desktop-resources/tray-icon@2x.png

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  artifactName: DshDesktop-${version}-${arch}.${ext}

dmg:
  artifactName: DshDesktop-${version}-${arch}.dmg

win:
  icon: resources/win-icon.png
  target:
    - nsis
  artifactName: DshDesktop-${version}-${arch}.${ext}

linux:
  category: Development
  icon: resources/app-icon.png
  target:
    - AppImage
  artifactName: DshDesktop-${version}-${arch}.${ext}
